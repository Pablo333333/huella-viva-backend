services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: huella-viva-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: huella-viva
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: huella-viva-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
